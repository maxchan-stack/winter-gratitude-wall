      const isCompact = isCompactMatrix && !isPreview && !isLargeStage;

        if (isPreview || isLargeStage) return '';

          'rotate-[-0.7deg]',
          'rotate-[0.6deg]',
          'rotate-[-0.4deg]',
          'rotate-[0.75deg]',
          'rotate-0'
        ];
        return `${tilts[sum % tilts.length]} hover:rotate-0`;

        setIsLikingAnim(true);
        setShowFloatingHeart(true);

            case 'arch':

            case 'stamp':
              return { className: 'p-3 rounded-sm shadow-md border-2 border-dashed', style: {} };
            case 'bauble':

            case 'classic':

              return { className: 'p-3 rounded-xl border-2 shadow-md', style: {} };
          }

    const GentleSnowCanvas = ({ enabled }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!enabled) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resizeCanvas = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 增加雪花總量並建立景深層次 (遠景細雪、中景初雪、近景棉雪)
        const particleCount = Math.min(85, Math.floor(window.innerWidth / 16));
        const particles = Array.from({ length: particleCount }, (_, idx) => {
          // 前 15% 為較大近景棉雪，中間 50% 為標準中景雪，其餘為細碎遠雪
          const isFore = idx < particleCount * 0.15;
          const isMid = idx < particleCount * 0.65;
          const radius = isFore ? Math.random() * 1.5 + 2.5 : isMid ? Math.random() * 1.2 + 1.4 : Math.random() * 0.8 + 0.7;
          const speedY = isFore ? Math.random() * 0.5 + 0.45 : isMid ? Math.random() * 0.35 + 0.25 : Math.random() * 0.2 + 0.15;
          const opacity = isFore ? Math.random() * 0.3 + 0.45 : isMid ? Math.random() * 0.25 + 0.25 : Math.random() * 0.2 + 0.12;
          return {
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            radius,
            speedY,
            speedX: (Math.random() - 0.5) * 0.35,
            opacity,
            swingFreq: Math.random() * 0.01 + 0.005,
            swingAmp: Math.random() * 0.25 + 0.1
          };
        });

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach((p) => {
            p.y += p.speedY;
            p.x += p.speedX + Math.sin(p.y * p.swingFreq) * p.swingAmp;

            if (p.y > canvas.height) {
              p.y = -5;
              p.x = Math.random() * canvas.width;
            }
            if (p.x > canvas.width) p.x = 0;
            if (p.x < 0) p.x = canvas.width;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(250, 247, 242, ${p.opacity})`;
            ctx.fill();
          });
          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          cancelAnimationFrame(animationFrameId);
        };
      }, [enabled]);

      if (!enabled) return null;

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0"
          aria-hidden="true"
        />
      );
    };

    const CelebrationSparkles = ({ trigger }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!trigger) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#C5A059', '#EAC882', '#FAF7F2', '#8C3A3A', '#4A755B'];
        const particles = Array.from({ length: 50 }, () => ({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 11,
          vy: (Math.random() - 0.7) * 13,
          size: Math.random() * 4.5 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.015
        }));

        let animationFrame;
        const update = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.25;
            p.alpha -= p.decay;

            if (p.alpha > 0) {
              alive = true;
              ctx.save();
              ctx.globalAlpha = Math.max(0, p.alpha);
              ctx.fillStyle = p.color;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          });

          if (alive) {
            animationFrame = requestAnimationFrame(update);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        };

        update();
        return () => cancelAnimationFrame(animationFrame);
      }, [trigger]);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-50"
          aria-hidden="true"
        />
      );
    };

              if (match) {
                const gvizObj = JSON.parse(match[1]);
                const rows = (gvizObj.table && gvizObj.table.rows) || [];
                remoteNotes = [];
                for (const r of rows) {
                  const c = r.c;
                  if (!c) continue;
                  const id = c[0] ? String(c[0].v || '') : '';
                  const to = c[1] ? String(c[1].v || '') : '';
                  const msg = c[2] ? String(c[2].v || '') : '';
                  const from = c[3] ? String(c[3].v || '') : '';
                  const theme = c[4] ? String(c[4].v || 'cream') : 'cream';
                  const shape = c[5] ? String(c[5].v || 'classic') : 'classic';
                  const icon = c[6] ? String(c[6].v || 'tree') : 'tree';
                  const category = c[7] ? String(c[7].v || '同儕祝福') : '同儕祝福';
                  const createdAt = c[8] ? Number(c[8].v) || Date.now() : Date.now();
                  const likes = c[9] ? Number(c[9].v) || 0 : 0;
                  const status = c[10] ? String(c[10].v || '').trim().toUpperCase() : '';
                  if (status === 'DELETED') continue;
                  if (id && msg) {
                    remoteNotes.push({ id, to, message: msg, from, theme, shape, icon, category, createdAt, likes, likedBy: [] });
                  }
                }
              }
            } catch (gvizErr) {}
          }

          if (Array.isArray(remoteNotes)) {
            setLocalDemoNotes((prev) => {
              const remoteIds = new Set(remoteNotes.map((n) => n.id));
              // 保留本地剛送出但雲端可能尚未及時入庫的卡片 (15秒安全窗口)
              const localUnsynced = prev.filter((n) => !remoteIds.has(n.id) && Date.now() - (n.createdAt || 0) < 15000);
              return [...localUnsynced, ...remoteNotes];
            });
            setCloudStatus('connected');
          }
        } catch (e) {
          setCloudStatus('offline');
        }
      }, []);

      // 初次載入與每 5 秒定期背景輪詢，確保大螢幕與所有學生裝置即時同步
      useEffect(() => {
        syncNotesFromCloud();
        const timer = setInterval(syncNotesFromCloud, 5000);
        return () => clearInterval(timer);
      }, [syncNotesFromCloud]);

      // 篩選與排序邏輯
      const displayedNotes = useMemo(() => {
        let list = [...localDemoNotes];

        if (searchKeyword.trim()) {
          const kw = searchKeyword.trim().toLowerCase();
          list = list.filter(
            (n) =>
              (n.to && n.to.toLowerCase().includes(kw)) ||
              (n.from && n.from.toLowerCase().includes(kw)) ||
              (n.message && n.message.toLowerCase().includes(kw))
          );
        }

        if (selectedFilterCategory !== '全部') {
          list = list.filter((n) => n.category === selectedFilterCategory);
        }

        if (sortBy === 'likesDesc') {
          list.sort((a, b) => (b.likes || 0) - (a.likes || 0));
        } else if (sortBy === 'seatAsc') {
          list.sort((a, b) => {
            const numA = parseInt(a.from.match(/\d+/)?.[0] || '999', 10);
            const numB = parseInt(b.from.match(/\d+/)?.[0] || '999', 10);
            return numA - numB;
          });
        } else {
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        }

        return list;
      }, [localDemoNotes, searchKeyword, selectedFilterCategory, sortBy]);

      // 輪播進度計時
      useEffect(() => {
        if (viewMode !== 'spotlight' || !isSpotlightPlaying || displayedNotes.length === 0) {
          setCarouselProgress(0);
          return;
        }

        const intervalMs = 50;
        const step = (intervalMs / CAROUSEL_DURATION) * 100;

        const timer = setInterval(() => {
          setCarouselProgress((prev) => {
            if (prev >= 100) {
              setSpotlightIndex((sIdx) => (sIdx + 1) % displayedNotes.length);
              return 0;
            }
            return prev + step;
          });
        }, intervalMs);

        return () => clearInterval(timer);
      }, [viewMode, isSpotlightPlaying, displayedNotes.length]);

      useEffect(() => {
        if (spotlightIndex >= displayedNotes.length) {
          setSpotlightIndex(0);
        }
      }, [displayedNotes.length, spotlightIndex]);

      // 鍵盤快捷鍵
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (activeLightboxNote) {
            if (e.key === 'Escape') {
              setActiveLightboxNote(null);
            } else if (e.key === 'ArrowLeft') {
              const currentIdx = displayedNotes.findIndex((n) => n.id === activeLightboxNote.id);
              if (currentIdx > 0) setActiveLightboxNote(displayedNotes[currentIdx - 1]);
            } else if (e.key === 'ArrowRight') {
              const currentIdx = displayedNotes.findIndex((n) => n.id === activeLightboxNote.id);
              if (currentIdx < displayedNotes.length - 1) setActiveLightboxNote(displayedNotes[currentIdx + 1]);
            }
          } else if (viewMode === 'spotlight') {
            if (e.key === 'ArrowLeft') {
              setSpotlightIndex((prev) => (prev - 1 + displayedNotes.length) % displayedNotes.length);
              setCarouselProgress(0);
            } else if (e.key === 'ArrowRight') {
              setSpotlightIndex((prev) => (prev + 1) % displayedNotes.length);
              setCarouselProgress(0);
            } else if (e.key === ' ') {
              e.preventDefault();
              setIsSpotlightPlaying((p) => !p);
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeLightboxNote, viewMode, displayedNotes]);

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => setIsFullscreen(true)).catch(() => {});
        } else {
          document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
        }
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const trimmedName = tempName.trim();
        if (!trimmedName) {
          showToast('請輸入姓名或暱稱');
          return;
        }
        const profile = {
          name: trimmedName,
          seatNumber: tempSeat.trim(),
          hasLoggedIn: true
        };
        setStudentProfile(profile);
        try {
          localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(profile));
        } catch (e) {}
        setIsEditingProfile(false);
        showToast(`歡迎進入冬日感恩牆，${trimmedName}！`);
      };

      const handleClearAllNotes = () => {
        setLocalDemoNotes([]);
        try {
          localStorage.setItem(NOTES_STORAGE_KEY, JSON.stringify([]));
        } catch (e) {}
        // 非同步通知 Google 試算表清空
        (async () => {
          try {
            await fetch(`${GAS_API_URL}?action=clearAllNotes&passcode=1225`, { mode: 'no-cors' });
          } catch (e) {}
        })();
        showToast('已將留言牆重設為完全空白！');
      };

      const handleCreateNote = (e) => {
        e.preventDefault();
        if (!messageField.trim()) {
          showToast('請填寫感恩與祝福內容');
          return;
        }

        setIsSubmitting(true);
        try {
          const displayAuthor = studentProfile.seatNumber
            ? `${studentProfile.seatNumber}號 ${studentProfile.name}`
            : studentProfile.name || '班級同學';

          const newNote = {
            id: `note-custom-${Date.now()}`,
            to: toField.trim() || '全班同學與師長',
            message: messageField.trim(),
            from: isAnonymous ? '溫暖的匿名同學' : displayAuthor,
            realAuthorName: displayAuthor,
            authorUid: 'local-student',
            isAnonymous,
            theme: selectedTheme,
            shape: selectedShape,
            icon: selectedIcon,
            category: selectedCategory,
            likes: 0,
            likedBy: [],
            createdAt: Date.now()
          };

          // 本地樂觀更新
          setLocalDemoNotes((prev) => [newNote, ...prev]);
          setToField('');
          setMessageField('');
          setIsAnonymous(false);
          setIsComposerOpen(false);

          // 非同步傳輸至 Google 試算表雲端資料庫
          (async () => {
            try {
              await fetch(GAS_API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'createNote', note: newNote })
              });
            } catch (postErr) {
              try {
                await fetch(`${GAS_API_URL}?action=create&data=${encodeURIComponent(JSON.stringify(newNote))}`, { mode: 'no-cors' });
              } catch (getErr) {}
            }
          })();

          const createdId = newNote.id;
          setNewlyCreatedId(createdId);
          setTimeout(() => setNewlyCreatedId(null), 4500);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setCelebrationTrigger((t) => t + 1);
          showToast('造型祝福卡已溫柔地釘上留言牆！');
        } catch (err) {
          showToast('發布失敗，請稍後重試');
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleToggleLike = (note) => {
        const currentUid = 'local-student';
        setLocalDemoNotes((prev) =>
          prev.map((item) => {
            if (item.id !== note.id) return item;
            const likedBy = Array.isArray(item.likedBy) ? item.likedBy : [];
            const hasLiked = likedBy.includes(currentUid);
            const updatedLikedBy = hasLiked
              ? likedBy.filter((id) => id !== currentUid)
              : [...likedBy, currentUid];
            const baseLikes = (item.likes || 0) + (hasLiked ? -1 : 1);
            return {
              ...item,
              likedBy: updatedLikedBy,
              likes: Math.max(0, baseLikes)
            };
          })
        );

        // 非同步通知 Google 試算表更新愛心數
        (async () => {
          try {
            await fetch(`${GAS_API_URL}?action=like&id=${encodeURIComponent(note.id)}`, { mode: 'no-cors' });
          } catch (e) {}
        })();
      };

      const handleCopyCardText = (note) => {
        const text = `致 ${note.to}：\n${note.message}\n—— 來自 ${note.from} 的冬日祝福`;
        navigator.clipboard.writeText(text).then(() => {
          showToast('已複製卡片祝福內容至剪貼簿！');
        }).catch(() => {
          showToast('複製失敗，請手動選取文字');
        });
      };

      const handleConfirmDelete = () => {
        if (!deleteConfirmId) return;
        const targetId = deleteConfirmId;
        setLocalDemoNotes((prev) => prev.filter((item) => item.id !== targetId));
        setDeleteConfirmId(null);

        // 非同步通知 Google 試算表刪除
        (async () => {
          try {
            await fetch(`${GAS_API_URL}?action=delete&id=${encodeURIComponent(targetId)}&passcode=1225`, { mode: 'no-cors' });
          } catch (e) {}
        })();

        showToast('已從留言牆移除該張卡片');
      };

      const handleExportCSV = () => {
        if (localDemoNotes.length === 0) {
          showToast('目前無留言可供匯出');
          return;
        }
        const headers = ['張貼時間', '卡片造型', '分類', '給誰(To)', '感恩與祝福內容', '署名(From)', '共鳴愛心數'];
        const rows = localDemoNotes
          .slice()
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
          .map((n) => {
            const dateStr = n.createdAt ? new Date(n.createdAt).toLocaleString('zh-TW') : '';
            const shapeName = (CARD_SHAPES.find((s) => s.id === n.shape) || CARD_SHAPES[0]).name;
            const escapeCSV = (str) => `"${String(str || '').replace(/"/g, '""')}"`;
            return [
              escapeCSV(dateStr),
              escapeCSV(shapeName),
              escapeCSV(n.category || '同儕祝福'),
              escapeCSV(n.to),
              escapeCSV(n.message),
              escapeCSV(n.from),
              n.likes || 0
            ].join(',');
          });

        const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `冬日感恩與祝福牆紀錄_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('已匯出全班祝福紀錄 CSV 檔案！');
      };

      const handleTeacherUnlock = (e) => {
        e.preventDefault();
        if (teacherPasscode.trim() === '1225' || teacherPasscode.trim().toLowerCase() === 'teacher') {
          setIsTeacherMode(true);
          setShowTeacherModal(false);
          setTeacherPasscode('');
          showToast('已啟用教師管理模式');
        } else {
          showToast('通行碼不正確（預設為 1225）');
        }
      };

      const formatTime = (timestamp) => {
        if (!timestamp) return '剛剛';
        const diffSec = Math.floor((Date.now() - timestamp) / 1000);
        if (diffSec < 60) return '剛剛';
        if (diffSec < 3600) return `${Math.floor(diffSec / 60)} 分鐘前`;
        if (diffSec < 86400) return `${Math.floor(diffSec / 3600)} 小時前`;
        const date = new Date(timestamp);
        return `${date.getMonth() + 1}月${date.getDate()}日`;
      };

      const renderCardIcon = (iconId, className = 'w-5 h-5') => {
        const found = CARD_ICONS.find((item) => item.id === iconId) || CARD_ICONS[0];
        const IconComponent = found.icon;
        return <IconComponent className={className} />;
      };

      // ==========================================
      // 學生登入歡迎頁面
      // ==========================================
      if (!studentProfile.hasLoggedIn) {
        return (
          <div className="min-h-screen bg-gradient-to-b from-[#0F1E16] via-[#16291F] to-[#1B3022] text-[#FAF7F2] flex flex-col justify-between relative overflow-hidden font-sans font-bold px-4 py-6">
            <GentleSnowCanvas enabled={snowEnabled} />

            <header className="relative z-10 max-w-5xl w-full mx-auto flex items-center justify-between pt-2">
              <div className="flex items-center gap-2 text-[#D4B475]">
                <TreePine className="w-5 h-5 sm:w-6 sm:h-6 stroke-[2.25]" />
                <span className="tracking-widest text-xs sm:text-sm font-extrabold uppercase opacity-95">
                  Winter Gratitude & Blessing
                </span>
              </div>
              <button
                onClick={() => setSnowEnabled(!snowEnabled)}
                className="flex items-center gap-1.5 text-xs font-extrabold text-[#D0E0D5] hover:text-[#FAF7F2] bg-[#1F3729]/80 px-3 py-1.5 rounded-full border border-[#385A46] transition"
              >
                <Snowflake className="w-3.5 h-3.5" />
                <span>{snowEnabled ? '飄雪中' : '無雪'}</span>
              </button>
            </header>

            <main className="relative z-10 flex-1 flex items-center justify-center my-6">
              <div className="w-full max-w-md bg-[#FAF7F2] text-[#141C18] rounded-2xl shadow-2xl border-2 border-[#E6DFD3] p-6 sm:p-10 relative overflow-hidden font-bold">
                <div className="absolute top-0 inset-x-0 h-2 bg-gradient-to-r from-[#8C3A3A] via-[#C5A059] to-[#4A6B53]" />

                <div className="flex flex-col items-center text-center mb-6">
                  <div className="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-[#EFECE6] border-2 border-[#DFD7C8] flex items-center justify-center text-[#8C3A3A] mb-3 shadow-inner">
                    <Heart className="w-6 h-6 sm:w-7 sm:h-7 stroke-[2.2]" />
                  </div>
                  <span className="text-xs tracking-widest uppercase text-[#8C7A5B] font-extrabold mb-1">
                    歲末溫馨企劃
                  </span>
                  <h1 className="text-xl sm:text-3xl font-serif font-extrabold text-[#1B3022] tracking-wide">
                    冬日感恩與祝福留言牆
                  </h1>
                  <p className="text-xs sm:text-sm font-bold text-[#3A443E] mt-2 leading-relaxed">
                    聖誕與新年的腳步近了。讓我們寫下一份真摯的感謝或期許，送給陪伴身旁的師長與同學。
                  </p>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-extrabold text-[#2C3531] uppercase tracking-wider mb-1">
                      座號 (選填)
                    </label>
                    <input
                      type="text"
                      inputMode="numeric"
                      value={tempSeat}
                      onChange={(e) => setTempSeat(e.target.value)}
                      placeholder="例如：12"
                      maxLength={10}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border-2 border-[#D8D0C5] text-[#141C18] font-bold placeholder-[#8E887E] focus:outline-none focus:ring-2 focus:ring-[#C5A059] transition text-base sm:text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-extrabold text-[#2C3531] uppercase tracking-wider mb-1">
                      您的姓名或班級暱稱 <span className="text-[#8C3A3A]">*</span>
                    </label>
                    <input
                      type="text"
                      required
                      value={tempName}
                      onChange={(e) => setTempName(e.target.value)}
                      placeholder="例如：子軒、小宇..."
                      maxLength={20}
                      className="w-full px-3.5 py-2.5 rounded-xl bg-white border-2 border-[#D8D0C5] text-[#141C18] font-bold placeholder-[#8E887E] focus:outline-none focus:ring-2 focus:ring-[#C5A059] transition text-base sm:text-sm"
                    />
                    <p className="text-[11px] font-bold text-[#525C56] mt-1">
                      ※ 發布祝福時仍可自由選擇是否設為「匿名」。
                    </p>
                  </div>

                  <button
                    type="submit"
                    className="w-full mt-2 py-3 px-6 rounded-xl bg-[#1B3022] hover:bg-[#25412E] active:scale-[0.99] text-[#FAF7F2] font-extrabold text-sm tracking-wide shadow-md flex items-center justify-center gap-2 min-h-[46px]"
                  >
                    <Sparkles className="w-4 h-4 text-[#D4B475]" />
                    推開木門，進入留言牆
                  </button>
                </form>

                <div className="mt-5 pt-4 border-t-2 border-[#E6DFD3] flex items-center justify-between text-xs font-extrabold text-[#49534D]">
                  <span>共 {localDemoNotes.length} 張卡片</span>
                  <button
                    type="button"
                    onClick={() => {
                      setStudentProfile({
                        name: '大螢幕展示',
                        seatNumber: '',
                        hasLoggedIn: true
                      });
                    }}
                    className="text-[#8C3A3A] hover:underline font-extrabold flex items-center gap-1"
                  >
                    直接進入大螢幕展示 →
                  </button>
                </div>
              </div>
            </main>

            <footer className="relative z-10 text-center text-xs font-bold text-[#B4C6B9] pb-2">
              願每一句真摯的話語，都成為冬日裡的一道暖光
            </footer>
          </div>
        );
      }

      // ==========================================
      // 主互動留言牆介面 (手機/平板/桌面全面最佳化)
      // ==========================================
      return (
        <div className="min-h-screen bg-gradient-to-b from-[#0F1E16] via-[#16291F] to-[#1B3022] text-[#FAF7F2] relative font-sans font-bold pb-28">
          <GentleSnowCanvas enabled={snowEnabled} />
          <CelebrationSparkles trigger={celebrationTrigger} />

          {/* 氛圍光暈：增強冬日暖紅壁爐微暈與香檳金光澤 */}
          <div className="fixed -top-10 right-1/5 w-[520px] h-[520px] bg-[#8C3A3A]/15 rounded-full blur-[130px] pointer-events-none" />
          <div className="fixed top-1/3 -left-20 w-[420px] h-[420px] bg-[#8C3A3A]/10 rounded-full blur-[110px] pointer-events-none" />
          <div className="fixed top-0 left-1/4 w-96 h-96 bg-[#C5A059]/8 rounded-full blur-[100px] pointer-events-none" />

          {/* 即時通知 Toast */}
          {toastMessage && (
            <div className="fixed bottom-20 sm:bottom-6 right-4 sm:right-6 z-50 bg-[#FAF7F2] text-[#141C18] border-l-4 border-[#C5A059] px-4 sm:px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 animate-toastIn font-extrabold text-xs sm:text-sm max-w-[90vw]">
              <Sparkles className="w-4 h-4 text-[#C5A059] shrink-0" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* 頂部導覽列 (手機二層自適應、桌面單行精緻) */}
          <header className="relative z-20 border-b border-[#2A4434]/90 bg-[#122219]/95 backdrop-blur-md sticky top-0 shadow-sm">
            {/* 頂部聖誕紅金節慶飾條 */}
            <div className="h-1 w-full bg-gradient-to-r from-[#8C3A3A] via-[#C5A059] to-[#8C3A3A] shadow-sm" />
            <div className="max-w-[1600px] mx-auto px-3.5 sm:px-6 lg:px-8 py-2.5 sm:py-3">
              {/* 第一行：標題 + 常用小功能按鈕 (符合手機觸控佈局) */}
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 sm:gap-3 min-w-0">
                  <div className="relative shrink-0">
                    <div className="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-[#1F3729] border-2 border-[#385A46] flex items-center justify-center text-[#D4B475] shadow-inner">
                      <TreePine className="w-5 h-5 sm:w-6 sm:h-6 stroke-[2.25]" />
                    </div>
                    {/* 聖誕冬青紅漿果立體裝飾 */}
                    <div className="absolute -top-1.5 -right-1.5 flex items-center pointer-events-none">
                      <span className="w-2.5 h-2.5 rounded-full bg-[#A62B2B] border border-[#FAF7F2] shadow-sm block" />
                      <span className="w-2 h-2 rounded-full bg-[#8C2020] border border-[#FAF7F2] -ml-1 -mt-1 shadow-sm block" />
                    </div>
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2">
                      <h1 className="text-base sm:text-2xl font-serif font-extrabold tracking-wide text-[#FAF7F2] truncate">
                        冬日感恩留言牆
                      </h1>
                      <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-extrabold bg-[#8C3A3A] text-[#FAF7F2] border border-[#B84545] shadow-sm shrink-0">
                        聖誕特輯・{displayedNotes.length}/{localDemoNotes.length}張
                      </span>
                    </div>
                    <p className="text-xs font-bold text-[#C2D4C8] hidden md:block mt-0.5">
                      點選任一張卡片可放大檢視或複製祝福內容
                    </p>
                  </div>
                </div>

          {/* 教師登入 Modal */}
          {showTeacherModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#FAF7F2] text-[#2C3531] rounded-2xl max-w-sm w-full p-5 sm:p-6 shadow-2xl border border-[#E6DFD3] font-bold">
                <div className="flex items-center gap-2 text-[#8C3A3A] mb-1.5">
                  <Shield className="w-5 h-5" />
                  <h3 className="text-base sm:text-lg font-serif font-extrabold text-[#1B3022]">
                    開啟教師管理模式
                  </h3>
                </div>
                <p className="text-xs text-[#5E6862] leading-relaxed mb-3">
                  請輸入教師通行碼（預設為 <code className="bg-[#EFECE6] px-1 py-0.5 rounded font-mono">1225</code>）：
                </p>
                <form onSubmit={handleTeacherUnlock} className="space-y-3">
                  <input
                    type="password"
                    value={teacherPasscode}
                    onChange={(e) => setTeacherPasscode(e.target.value)}
                    placeholder="請輸入通行碼"
                    autoFocus
                    className="w-full px-3 py-2 rounded-xl bg-white border border-[#D8D0C5] text-base sm:text-sm font-bold focus:outline-none focus:ring-1 focus:ring-[#8C3A3A]"
                  />
                  <div className="flex justify-end gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => {
                        setShowTeacherModal(false);
                        setTeacherPasscode('');
                      }}
                      className="px-3.5 py-2 rounded-xl text-xs text-[#5E6862] hover:bg-[#EFECE6]"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl text-xs bg-[#8C3A3A] text-white font-extrabold"
                    >
                      確認開啟
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 刪除確認 Modal */}
          {deleteConfirmId && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#FAF7F2] text-[#2C3531] rounded-2xl max-w-sm w-full p-5 sm:p-6 shadow-2xl border border-[#E6DFD3] font-bold">
                <h3 className="text-base font-serif font-extrabold text-[#1B3022] mb-1.5">
                  確定要移除這張祝福卡片嗎？
                </h3>
                <p className="text-xs text-[#5E6862] mb-4">
                  移除後將無法復原，留言牆上的同學將不再看到這則內容。
                </p>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setDeleteConfirmId(null)}
                    className="px-3.5 py-2 rounded-xl text-xs text-[#5E6862] hover:bg-[#EFECE6]"
                  >
                    保留
                  </button>
                  <button
                    onClick={handleConfirmDelete}
                    className="px-4 py-2 rounded-xl text-xs bg-[#8C3A3A] text-white font-extrabold"
                  >
                    確認移除
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
